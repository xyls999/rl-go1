[gap_intrusion]
# Keep a graded signal for unsafe support intrusion, but make the first lip
# contact comparable to the once-per-gap clearance credit rather than a cliff.
weight = -8.0
margin = 0.02
span = 0.15
entry_multiplier = 1.5
base_margin = 0.15

[leap_clear]
# Pay once for stable per-gap clearance. The V1327 entrance scorer allows
# supported step-over for short gaps and requires flight only for long gaps.
weight = 1.0
# These thresholds are retained for the generic scorer; the V1327 entrance
# path uses the geometry-aware once-per-gap clearance event.
min_progress = 0.30
flight_seconds = 0.06
bonus = 6


[speed_error_l1]
# Restore the V1323 A02 control's speed-error penalty.
weight = -0.35
scale = 0.10

# Positive, bounded bonus only for stable forward landings in the mixed
# course's first three short trenches and its first tyre field.
[mixed_transition_balance]
weight = 1.5
start_offset = 1.20
end_offset = 5.60
minimum_height = 0.23
target_height = 0.31
minimum_upright = 0.55
target_upright = 0.90

# v7b optional mixed-course terms; raw scores are [0,1].
[supported_short]
weight = 1.6

[safe_segment]
weight = 6.0

[edge_contact]
weight = 0.0

[tire_stall]
weight = -2.0

# Only new upright, foot-supported forward distance in the mixed tyre band.
[tire_progress]
weight = 1.0

# Preserved optional-table schema; disabled for the V1327 short-gap objective.
[four_feet_jump_air_time]
weight = 2.0
max_air_time = 0.55

# Existing video-informed hooks: waiting/retreating at a lip must not outscore
# a forward attempt; both costs are bounded and reset on forward movement.
[stall_grow]
weight = -1.0
growth_cap = 2.0

[backward_motion]
weight = -1.0

# Soft fore/aft envelope for swing feet during ordinary supported gait.
# The runtime masks this term in the approach/crossing/landing window.
[fore_aft_swing_l2]
weight = -0.25
max_excursion = 0.32

# Do not bound on flat/support terrain; a short gap is an exception, not a
# reason to jump. Grace avoids penalizing a single brief contact transition.
[non_gap_airborne]
weight = -0.5
grace_seconds = 0.06
ramp_seconds = 0.12

# Small, progress-gated target increase for leading feet at short gaps only.
# Horizontal width selects step-over versus flight; it does not scale height.
[short_gap_lift]
weight = 0.5
target_height = 0.22
std = 0.04

# One control-step event cost on the transition into a newly detected gap fall.
# CONTROL_DT=0.02 s, so the configured one-step impulse is -40 episode-return points.
[fell_into_gap]
weight = -2000.0
