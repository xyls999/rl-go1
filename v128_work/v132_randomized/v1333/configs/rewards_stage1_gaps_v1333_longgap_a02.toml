# Long-gap warm-start fork from the exact saved model_1298 reward contract.
# Only forward_progress and four_feet_jump_air_time weights change here.
# V1330 gait/gap candidate, isolated from the completed V1329 run.
# Keep ordinary walking grounded and compact; relax those penalties only in
# simulator-derived gap approach/landing windows. Short gaps reward a modest
# leading-foot lift; long gaps retain the stable, width-aware flight scorer.

[track_linear_velocity]
# Restore conservative magnitude tracking from the V1323 A02 control arm.
weight = 3.0
# The tracking kernel has to keep gradient across the whole commanded band.
# At std = 0.20 a 0.4 m/s error scores exp(-4) ~ 0.02, so the term was dead
# exactly when the policy ran at twice its command and nothing pulled it back.
std = 0.45

[track_yaw_velocity]
weight = 0.2
std = 0.35

[forward_velocity]
weight = 0.5
target_velocity = 0.45
negative_velocity_penalty = 1.0

[forward_progress]
weight = 6.0
# Match the V1323 A02 control saturation point.
max_progress_speed = 0.9

