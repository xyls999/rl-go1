# V131 landing-stability pilot: all V11 weights are unchanged; the runtime
# now pays the landing term over the post-touchdown window and attenuates it by
# roll/pitch angular rate. This copy pins the exact reward config for the run.
# Gaps contract v3: the proven walking contract (gait clock, phase contact,
# contact cycle, vertical-speed damping -- the terms that keep a real trot)
# plus the four jump terms, which the runtime now pays only inside the trench
# window. v2 had relaxed exactly those anti-hop terms for the jump seed, and
# the policy degenerated into an in-place hop that averaged 0.14 m/s.

[track_linear_velocity]
weight = 3.0
# The tracking kernel has to keep gradient across the whole commanded band.
# At std = 0.20 a 0.4 m/s error scores exp(-4) ~ 0.02, so the term was dead
# exactly when the policy ran at twice its command and nothing pulled it back.
std = 0.45

[track_yaw_velocity]
weight = 0.2
std = 0.35

