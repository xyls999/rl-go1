[gap_intrusion]
# Any part of the robot entering a trench: graded while inside, plus a large
# one-off hit on the step that enters, so walking into a void is never a cheap
# alternative to picking a take-off point and leaping.
weight = -80.0
margin = 0.02
span = 0.15
entry_multiplier = 40.0
base_margin = 0.15

[leap_clear]
# Pay once for actually jumping a void: real four-foot flight phase, real
# forward progress and nothing inside the trench. This is what makes leaping a
# wide gap the profitable way past it.
weight = 1.0
# 0.06 s is reachable by the trained trot's suspension, 0.10 s was not, so the
# signal never fired and the policy never learned to leap.
min_progress = 0.30
flight_seconds = 0.06
bonus = 6


[speed_error_l1]
# Constant-gradient penalty on |realised - commanded| forward speed (m/s).
# Measured: with weight -0.5 / scale 0.5 the eval still showed 0.958 m/s against a
# 0.482 command, so the charged magnitude was ~4x weaker than intended and the
# progress rewards dominated. Scale 0.10 makes the same error cost ~5x more.
# Weight -0.35 makes a 0.4 m/s overspeed cost ~1.4 per step, which is larger
# than any saturated progress term can pay back.
weight = -0.35
scale = 0.10

# Positive, bounded bonus only for stable forward landings in the mixed
# course's first three short trenches and its first tyre field.
[mixed_transition_balance]
weight = 1.5
start_offset = 1.20
end_offset = 5.60
minimum_height = 0.23
target_height = 0.31
minimum_upright = 0.55
