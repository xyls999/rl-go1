# Stage-1 straight-course locomotion reward. RewardManager multiplies each
# weighted term by the 0.02 s environment step. V18 keeps the immutable
# initial-world direction and rectangular finish region, while annealing the
# V17 gait teacher and constraining abrupt hip ab/adduction.

[track_linear_velocity]
weight = 1.0
std = 0.25

[track_yaw_velocity]
weight = 0.4
std = 0.35

[forward_velocity]
weight = 2.0
target_velocity = 0.60
negative_velocity_penalty = 1.0

[forward_progress]
weight = 6.0
max_progress_speed = 0.9

[goal_closeness]
weight = 0.40
max_distance = 10.0

[course_checkpoint]
weight = 10.0
first = 0.25
second = 0.50
third = 0.75

[goal_reached]
weight = 200.0
# The straight course ends at the goal, not where the staircase ends. Any point
# in the following one-metre strip, across the full four-metre half-width route,
# is a completion; Stage-1 does not require hitting a single centre point.
start_offset = 19.10
end_offset = 20.10
half_width = 4.0

[straight_line]
weight = 0.30
std = 0.75

# Direction of horizontal world velocity relative to the heading captured at
# reset. This is independent of speed magnitude (apart from a low-speed gate).
[velocity_direction]
weight = 3.00
std = 0.30
min_speed = 0.10

# Continuous cross-track cost retains a useful gradient after the Gaussian
# straight-line reward has become small.
[cross_track_l2]
weight = -0.60
deadband = 0.10
scale = 0.75
max_cost = 4.0

[heading_alignment]
weight = 0.80
std = 0.35

[upright]
weight = 0.20

# Explicit diagonal clock: FL+RR and FR+RL are separated by half a cycle.
# Frequency stays fixed while a filtered terrain gate changes only duty factor
# and clearance. This avoids the abrupt phase-speed switch seen in V18.
[phase_contact]
weight = 0.50
flat_hz = 2.40
terrain_hz = 2.40
flat_duty_factor = 0.56
terrain_duty_factor = 0.62
transition_width = 0.12
force_scale = 25.0
slip_scale = 0.25

[phase_clearance]
weight = 0.20
flat_height = 0.080
terrain_height = 0.130
std = 0.040

# Support-relative trunk height prevents the low crouching/crawling solution.
[base_height]
weight = 0.80
target_height = 0.340
minimum_height = 0.285
std = 0.050
low_height_penalty = 1.50

# EMA load balance permits instantaneous stair asymmetry while requiring all
# four legs to contribute over time.
[foot_load_balance]
weight = -0.30
ema_alpha = 0.96
tolerance = 0.08
scale = 0.15
max_cost = 4.0
force_threshold = 4.0

[trot_gait]
weight = 0.0
std = 0.10
max_err = 0.20
velocity_threshold = 0.10
terrain_relief = 0.30

[foot_clearance]
weight = 0.0
target_height = 0.075
min_height = 0.045
terrain_target_height = 0.145
terrain_min_height = 0.105
std = 0.040
velocity_tanh = 2.0

[small_steps]
weight = 0.0
target_length = 0.20
min_length = 0.05
max_length = 0.38

[step_frequency]
weight = 0.0
target_hz = 2.0
min_hz = 0.8
max_hz = 4.0
window_seconds = 1.0

[four_feet_grounded]
weight = 0.0
grace_seconds = 0.12
ramp_seconds = 0.25

# Every foot must return to contact.  Unlike the old all-feet-grounded
# penalty, this directly penalizes one leg being held in the air to farm
# clearance reward.
[foot_contact_cycle]
weight = -0.15
max_air_time = 0.65
ramp_seconds = 0.25
terrain_relief = 0.25

# Isaac Lab Spot-style soft symmetry regularizer.  This compares the last
# completed air and stance intervals of all four feet.  It does not require a
# fixed number of touchdowns in a time window, so a deliberate stair foothold
# is not treated as a failure.
[air_time_variance]
weight = 0.0
max_time = 0.50
terrain_relief = 0.25

# Direct diagonal-pair coupling.  A front-left lift should be paired with a
# rear-right lift, and front-right with rear-left.  Unlike V13 this remains
# active on stairs, but is softened enough to permit brief three-foot support.
[flat_trot_pattern]
weight = 0.0
terrain_relief = 0.30

[foot_lateral]
weight = -0.25
max_outward_deviation = 0.06
max_inward_deviation = 0.06
cross_body_penalty = 2.0
terrain_relief = 0.45

[feet_air_time]
weight = 0.0
threshold = 0.18
max_air_time = 0.45
command_threshold = 0.10

[feet_slide]
weight = -0.02
contact_force_threshold = 1.0
deadband = 0.04
scale = 0.25
terrain_relief = 0.35

[four_feet_airborne]
weight = -1.50

[base_vertical_velocity_l2]
weight = -0.35

[base_roll_pitch_rate_l2]
weight = -0.12
scale = 1.5

[base_orientation_l2]
weight = -0.50
scale = 0.35

[action_rate_l2]
weight = -0.0010

[action_acceleration_l2]
weight = -0.0007

[joint_torque_l2]
weight = -0.00020

[joint_deviation_l2]
weight = -0.06
deadband = 0.18
scale = 0.60

# Go1 has no ankle yaw joint; visible toe-in/toe-out is mostly produced by
# abrupt hip ab/adduction and lateral foot placement.  These two terms target
# that mechanism without suppressing thigh/calf step height.
[hip_abduction_deviation_l2]
weight = -0.04
deadband = 0.10
scale = 0.30

[hip_abduction_velocity_l2]
weight = -0.0005
scale = 4.0

[joint_power_l1]
weight = -0.00003

[joint_acceleration_l2]
weight = -0.00000005

[fallen]
weight = -12.0

[collision]
weight = -20.0

[out_of_bounds]
weight = -12.0
